stages:
  - validate

validate-json:
  stage: validate
  image: python:3.12-slim
  script:
    - python -c "import json,sys; json.load(open('Pathly.postman_collection.json',encoding='utf-8')); json.load(open('Pathly.postman_environment.json',encoding='utf-8')); print('ok')"
  rules:
    - if: $CI_PIPELINE_SOURCE
